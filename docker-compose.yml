name: synctohdd

services:
  synctohdd:
    image: ghcr.io/alexlx4773h/synctohdd:v0.1.1
    pull_policy: always
    build: .
    container_name: synctohdd
    restart: unless-stopped
    ports:
      - "6060:6060"
    environment:
      - SYNCTOHDD_CONFIG=/app/data/config.yaml
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent app data (stores config.yaml and synctohdd.db)
      - /DATA/AppData/synctohdd:/app/data

      # Storage & Disks on Ubuntu / CasaOS:
      # Mounting /media and /mnt gives the container instant access to all external USB drives
      # (e.g. /media/devmon/LX2T or any plugged in storage drive)
      - /media:/media:rw
      - /mnt:/mnt:rw

      # If your server source files are in a custom directory (e.g. /sg2b),
      # ensure the folder exists on your server, then uncomment or add it:
      # - /sg2b:/sg2b:ro

x-casaos:
  architectures:
    - amd64
    - arm64
  main: synctohdd
  author: Alex
  category: Backup
  developer: AlexLX4773H
  title:
    en_US: SyncToHDD
  tagline:
    en_US: Backup server data to external USB3 HDD with real-time Web UI
  description:
    en_US: |
      Self-hosted file, folder, and directory backup and synchronization tool with real-time Web UI and full historical run tracking.
      
      Features:
      • Back up Linux server directories directly to an external USB3 HDD
      • High performance incremental sync using rsync with automatic change tracking
      • Live progress tracking in your browser with transfer speed and file counters
      • Full run history: inspect added, modified, and deleted files with sizes
      • Dry-run mode: preview what would be changed without touching disk
      • Mirror (delete removed files) and Additive (never delete) backup modes
  icon: https://raw.githubusercontent.com/AlexLX4773H/SyncToHDD/master/assets/icon.png
  thumbnail: https://raw.githubusercontent.com/AlexLX4773H/SyncToHDD/master/assets/icon.png
  port_map: "6060"
  port: 6060
  scheme: http
  index: /
  tips:
    before_install:
      en_US: |
        1. All external USB drives under /media (e.g. /media/devmon/LX2T) are automatically accessible.
        2. If your source data is in /sg2b, ensure that folder exists on your Ubuntu server before adding it under volumes.
