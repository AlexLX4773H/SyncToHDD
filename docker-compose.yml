version: "3.8"

services:
  synctohdd:
    build: .
    container_name: synctohdd
    restart: unless-stopped
    ports:
      - "6060:6060"
    environment:
      - SYNCTOHDD_CONFIG=/app/config.yaml
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent configuration and database
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data

      # Host filesystem mounts (Adjust these to match your actual server paths)
      # Source data: Read-only mount recommended for backup safety
      - /sg2b:/sg2b:ro

      # Destination external USB3 HDD: Read-write mount required
      - /media/devmon/LX2T:/media/devmon/LX2T
